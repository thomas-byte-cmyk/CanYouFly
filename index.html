<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#87c9e8" />
    <title>CAN YOU FLY? — prototype</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b2321; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game { width: 100%; height: 100%; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #2b2321; color: #fdf3e1; font: 600 20px/1.4 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">📱↻<br />Tourne ton téléphone<br />pour piloter en mode paysage</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
