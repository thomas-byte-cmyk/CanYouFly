name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (physique, atterrissage, récompenses)
        run: npm test
      - name: Build (vérifie aussi les types)
        run: npm run build
      - name: Budget de poids
        run: npm run check-size
